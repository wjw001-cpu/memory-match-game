<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Memory Match Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header>
    <h1>🃏 Memory Match</h1>
    <p class="subtitle">Flip cards and find all matching pairs!</p>
  </header>

  <!-- ── Setup Screen (shown before game starts) ────────── -->
  <section id="setup-screen">
    <div class="setup-card">
      <h2>Enter Your Name</h2>
      <input
        type="text"
        id="player-name"
        placeholder="Your name..."
        maxlength="20"
        autocomplete="off"
      />
      <button id="start-btn">🚀 Start Game</button>
    </div>
  </section>

  <!-- ── Game Screen (shown while playing) ──────────────── -->
  <section id="game-screen" class="hidden">

    <!-- Stats bar -->
    <div id="stats-bar">
      <div class="stat">
        <span class="stat-label">Player</span>
        <span class="stat-value" id="display-name">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">Moves</span>
        <span class="stat-value" id="move-count">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timer-display">0:00</span>
      </div>
      <div class="stat">
        <span class="stat-label">Pairs</span>
        <span class="stat-value" id="pairs-found">0 / 8</span>
      </div>
    </div>

    <!-- Card grid (populated by game.js) -->
    <div id="game-board"></div>

    <button id="restart-btn">🔄 Restart</button>
  </section>

  <!-- ── Win Modal (shown when game is complete) ─────────── -->
  <div id="win-modal" class="hidden">
    <div class="modal-box">
      <div class="win-emoji">🏆</div>
      <h2>You Win!</h2>
      <p id="win-stats"></p>
      <p id="save-status" class="save-status"></p>
      <div class="modal-buttons">
        <button id="play-again-btn">🎮 Play Again</button>
        <button id="view-scores-btn">📊 View Leaderboard</button>
      </div>
    </div>
  </div>
  <div id="modal-overlay" class="hidden"></div>

  <!-- ── Leaderboard ─────────────────────────────────────── -->
  <section id="leaderboard">
    <h2>🏅 Leaderboard</h2>
    <table id="scores-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Moves</th>
          <th>Time</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="scores-body">
        <tr><td colspan="5" class="no-scores">No scores yet — be the first!</td></tr>
      </tbody>
    </table>
    <button id="refresh-scores-btn">🔄 Refresh Scores</button>
  </section>

  <script src="game.js"></script>
</body>
</html>
